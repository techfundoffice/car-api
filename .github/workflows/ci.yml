name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the oldest maintained LTS; 22 is current LTS. The packaging
        # checks are the reason to run both — module resolution is where Node
        # versions differ most.
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify packaging
        run: npm run verify:packaging

      # Guarded so the workflow is correct both before and after a test suite
      # lands on main.
      - name: Unit tests
        run: |
          if compgen -G "test/*.test.js" > /dev/null; then
            node --test "test/*.test.js"
          else
            echo "No unit tests present yet — skipping."
          fi
        shell: bash

      - name: Check the published tarball contents
        run: npm pack --dry-run
